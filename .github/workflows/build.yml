name: Build Game

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Godot
      uses: chickensoft-games/setup-godot@v1
      with:
        version: 4.3.0
        use-dotnet: true
    
    - name: Setup export templates
      run: |
        mkdir -p ~/.local/share/godot/export_templates/4.3.0.stable.mono
        godot --headless --quit || true
    
    - name: Build for Windows
      run: |
        mkdir -p builds/windows
        cd game
        godot --headless --export-release "Windows Desktop" ../builds/windows/TowerDefense.exe
    
    - name: Upload Windows Build
      uses: actions/upload-artifact@v3
      with:
        name: windows-build
        path: builds/windows/

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Godot
      uses: chickensoft-games/setup-godot@v1
      with:
        version: 4.3.0
        use-dotnet: true
    
    - name: Build for Linux
      run: |
        mkdir -p builds/linux
        cd game
        godot --headless --export-release "Linux/X11" ../builds/linux/TowerDefense.x86_64
    
    - name: Upload Linux Build
      uses: actions/upload-artifact@v3
      with:
        name: linux-build
        path: builds/linux/

  build-web:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Godot
      uses: chickensoft-games/setup-godot@v1
      with:
        version: 4.3.0
        use-dotnet: true
    
    - name: Build for Web
      run: |
        mkdir -p builds/web
        cd game
        godot --headless --export-release "Web" ../builds/web/index.html
    
    - name: Upload Web Build
      uses: actions/upload-artifact@v3
      with:
        name: web-build
        path: builds/web/
    
    - name: Deploy to GitHub Pages
      if: startsWith(github.ref, 'refs/tags/')
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./builds/web
